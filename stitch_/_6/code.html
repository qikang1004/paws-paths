<style>
        body {
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Form input focus styles */
        input:focus {
            outline: none;
            box-shadow: none;
        }

        .upload-area-dashed {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='24' ry='24' stroke='%23ff9f5a' stroke-width='2' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='round'/%3e%3c/svg%3e");
            border-radius: 24px;
        }

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-safe-top pb-safe-bottom overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-background/90 backdrop-blur-md flex justify-between items-center px-margin-mobile py-sm transition-all duration-300 shadow-sm shadow-surface-variant/20">
<button aria-label="返回" class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform duration-150 ease-in-out hover:bg-surface-variant text-on-surface">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface flex-1 text-center truncate px-md">
            犬证上传
        </h1>
<div class="w-10 h-10 flex items-center justify-center">
<!-- Placeholder to balance the flex layout -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-margin-mobile py-lg gap-xl">
<!-- Upload Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-body-lg text-body-lg text-on-surface">上传犬证原件照片</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">请确保证件完整、清晰，无反光或遮挡。</p>
<div class="relative w-full aspect-[4/3] mt-sm group cursor-pointer active:scale-[0.98] transition-transform duration-200">
<!-- Dashed Upload Area -->
<div class="absolute inset-0 upload-area-dashed bg-surface-container-low flex flex-col items-center justify-center gap-md group-hover:bg-surface-container transition-colors duration-200">
<div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[32px] text-primary">add_a_photo</span>
</div>
<div class="text-center">
<p class="font-body-lg text-body-lg text-primary">点击上传</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">支持 JPG/PNG 格式</p>
</div>
</div>
<!-- Hidden File Input -->
<input accept="image/*" aria-label="上传犬证照片" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" type="file"/>
</div>
</section>
<!-- Guidance / Example Card -->
<section class="bg-surface-container-highest/30 rounded-lg p-md flex items-start gap-md border border-outline-variant/30">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center shrink-0 mt-xs">
<span class="material-symbols-outlined filled text-[16px] text-on-secondary-container">lightbulb</span>
</div>
<div class="flex-1">
<h3 class="font-body-md text-body-md text-on-surface font-semibold mb-xs">照片要求提示</h3>
<ul class="font-body-sm text-body-sm text-on-surface-variant space-y-1">
<li class="flex items-center gap-xs"><span class="material-symbols-outlined text-[14px] text-primary">check_circle</span> 证件四角完整露出在画面内</li>
<li class="flex items-center gap-xs"><span class="material-symbols-outlined text-[14px] text-primary">check_circle</span> 文字、照片清晰可辨认</li>
<li class="flex items-center gap-xs"><span class="material-symbols-outlined text-[14px] text-primary">check_circle</span> 确保在有效期内</li>
</ul>
</div>
</section>
<!-- Form Fields Section -->
<section class="flex flex-col gap-md">
<h2 class="font-body-lg text-body-lg text-on-surface mb-xs">确认证件信息</h2>
<!-- Field: License Number -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant ml-xs" for="license-number">犬证编号</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant/50">badge</span>
<input class="w-full bg-surface-container-lowest border-2 border-outline/20 rounded-full py-md pl-[48px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary-container focus:bg-surface-container-lowest transition-all duration-200" id="license-number" placeholder="请输入犬证编号" type="text"/>
</div>
</div>
<!-- Field: Registrant Name -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant ml-xs" for="registrant-name">登记人姓名</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant/50">person</span>
<input class="w-full bg-surface-container-lowest border-2 border-outline/20 rounded-full py-md pl-[48px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary-container focus:bg-surface-container-lowest transition-all duration-200" id="registrant-name" placeholder="与证件上姓名一致" type="text"/>
</div>
</div>
<!-- Field: Registrant ID Number -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant ml-xs" for="registrant-id">登记人身份证号</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant/50">branding_watermark</span>
<input class="w-full bg-surface-container-lowest border-2 border-outline/20 rounded-full py-md pl-[48px] pr-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:border-primary-container focus:bg-surface-container-lowest transition-all duration-200" id="registrant-id" placeholder="用于身份核验" type="text"/>
</div>
</div>
<!-- Field: Validity Period -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant ml-xs" for="validity-period">有效期至</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant/50">calendar_month</span>
<input class="w-full bg-surface-container-lowest border-2 border-outline/20 rounded-full py-md pl-[48px] pr-md font-body-md text-body-md text-on-surface focus:border-primary-container focus:bg-surface-container-lowest transition-all duration-200 appearance-none min-h-[56px]" id="validity-period" type="date"/>
</div>
</div>
</section>
<!-- Extra Bottom Padding to prevent content from hiding behind sticky button -->
<div class="h-24"></div>
</main>
<!-- Sticky Bottom Action Button -->
<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-background via-background/95 to-transparent pt-xl pb-margin-mobile px-margin-mobile z-40">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-full py-md shadow-[0_8px_16px_-4px_rgba(148,74,7,0.2)] active:scale-[0.98] active:shadow-[0_4px_8px_-2px_rgba(148,74,7,0.2)] transition-all duration-200 flex items-center justify-center gap-sm">
<span>提交审核</span>
<span class="material-symbols-outlined">send</span>
</button>
<p class="text-center font-body-sm text-label-md text-on-surface-variant mt-sm">审核通常需要 1-3 个工作日完成</p>
</div>
</div>
<script>
        // Simple script to handle visual feedback on file upload (simulated)
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.querySelector('input[type="file"]');
            const uploadArea = document.querySelector('.upload-area-dashed');
            
            if(fileInput && uploadArea) {
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files.length > 0) {
                        // Simulate file selected state
                        uploadArea.classList.remove('bg-surface-container-low', 'border-dashed');
                        uploadArea.classList.add('bg-primary-container/10', 'border-solid', 'border-primary-container');
                        uploadArea.style.backgroundImage = 'none';
                        uploadArea.style.border = '2px solid #ff9f5a';
                        
                        const icon = uploadArea.querySelector('.material-symbols-outlined');
                        const textMain = uploadArea.querySelector('.text-primary');
                        const textSub = uploadArea.querySelector('.text-on-surface-variant');
                        
                        if(icon) icon.textContent = 'check_circle';
                        if(textMain) textMain.textContent = '已选择图片';
                        if(textSub) {
                            textSub.textContent = e.target.files[0].name;
                            textSub.classList.add('truncate', 'max-w-[200px]', 'block', 'mx-auto');
                        }
                    }
                });
            }
        });
    </script>
</body></html>
